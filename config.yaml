# ===========================================================================
#  NepSyc configuration
#===========================================================================

providers:
  ank:
    base_url: https://llm.ank-world.com/v1
    api_key_env: ANK_API_KEY
    requests_per_minute: 600

  groq:
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    requests_per_minute: 60

  gemini:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GEMINI_API_KEY
    requests_per_minute: 10

  azure_openai:
    api_type: azure
    base_url: https://misumi-eastus-2480-openai-test.openai.azure.com/
    api_key_env: AZURE_API_KEY
    api_version: 2024-08-01-preview
    deployment_name: gpt-4o-0806
    requests_per_minute: 60

  local:
    # Runs weights in-process via transformers instead of calling a remote gateway -- see
    # nepsyc/providers.py's LocalHFProvider. No base_url/api_key_env: a target_models `id`
    # routed here IS a Hugging Face Hub repo id, loaded directly. Added because Qwen and
    # Gemma both understand Nepali reasonably well but neither is reliably reachable over
    # this project's configured gateways (Groq serves no Qwen2.5 model at all; `ank`
    # currently 401s). requests_per_minute is meaningless for local inference but kept so
    # this provider shares the same rate-limiter code path as every other one.
    api_type: local
    requests_per_minute: 6
    # Forced to cpu: this machine's torch build has no CUDA support (float32, CPU-only --
    # see nepsyc/hidden_states.py:load_model for the dtype/device_map this feeds). Set to
    # `cuda` instead on a machine with a CUDA-enabled torch build, for GPU inference.
    device: cuda

run:
  # <<< EDIT #1 --------------------------------------------------------------
  # Put the name of ONE provider block from above. Any model below that doesn't
  # name its own provider gets sent here.
  #   ank       = your llm.ank-world.com endpoint
  #   groq      = the original setup
  default_provider: ank
  language: en
  dataset: null # null = data/nepsyc_<language>.csv
  output_dir: results
  cache_path: .cache/responses.jsonl

  # SPEED. These two multiply. The old values (4 / 60) capped the entire sweep
  # at ~1 request per second, which is why runs took hours. requests_per_minute
  # is a hard global gate, so raising max_workers alone does nothing.
  max_workers: 2
  requests_per_minute: 30

  behaviours: [] # empty = all six
  limit_per_behaviour: 0 # 0 = no limit
  limit_total: 0 # 0 = no limit

generation:
  temperature: 0.0
  # Reasoning models (Qwen3.x, GLM, DeepSeek-R1) burn part of this budget on
  # hidden <think> tokens before the visible answer. If replies come back
  # truncated mid-sentence, raise this to 1200 first -- a truncated reply gets
  # judged as a hedge and quietly corrupts your scores.
  # Raised from 2000 -> 3500: gpt-oss-20b (and other reasoning models) put their
  # chain-of-thought in a separate `reasoning` field, not inline in `content`, and on
  # the longer/multi-turn benchmark prompts (e.g. the two-turn `pressure` condition)
  # it was burning the whole 2000-token budget on hidden reasoning before writing
  # anything to `content` -- HTTP 200, finish_reason=length, content="". That's a
  # silent failure: no error is raised, so it was being scored as a blank/hedge
  # instead of flagged. 3500 gives it room to finish reasoning and still answer.
  max_tokens: 3500
  system_prompt: null

# ---------------------------------------------------------------------------
#  TARGET MODELS -- the models being tested for sycophancy.
#  A model only needs a `provider:` line if it lives somewhere OTHER than
#  run.default_provider above.
#
#  hf_repo_id (optional): a Hugging Face Hub repo id this model's weights can be loaded
#  from locally with transformers.AutoModelForCausalLM. Only used by
#  scripts/analyze_hidden_states.py and the dashboard's "Local hidden-state analysis"
#  section -- unrelated to how the model is served for the actual eval sweep above. Leave
#  it unset for anything with no local weights to load (any API-only model, e.g. OpenAI's)
#  or whose served id isn't itself a standard-format HF repo (e.g. a quantized gateway
#  build) -- such models are simply not offered by that feature.
# ---------------------------------------------------------------------------
target_models:
  # Your endpoint (llm.ank-world.com). Confirmed live against /v1/models on 2026-08-24 --
  # note the exact casing on qwen3.8-27B ("B" capitalized; the gateway 404s on lowercase).
  # No hf_repo_id: served via a custom gateway, not a standard-format HF repo.
  - id: qwen3.8-27B
    label: Qwen3.8-27B
    strip_think: true

  # ornith and qwen-ornith are two more models this same gateway serves. qwen-ornith is an
  # auto-router: per llm.ank-world.com, it inspects the question and routes to whichever of
  # qwen3.8-27B / ornith fits, so its replies are effectively "whichever of the other two the
  # router picked" rather than a distinct model in its own right -- kept as its own target
  # since sycophancy behaviour can still differ from either fixed model depending on routing.
  - id: ornith
    label: Ornith
    strip_think: true

  - id: qwen-ornith
    label: Qwen-Ornith (auto-router)
    strip_think: true

  # Groq dropped every llama-3.x chat model from its catalog (confirmed live
  # against /v1/models on 2026-08-22) -- llama-3.3-70b-versatile and
  # llama-3.1-8b-instant are both gone, so they're removed rather than kept
  # commented out.
  - id: openai/gpt-oss-20b
    label: GPT-OSS-20B
    provider: groq
    hf_repo_id: openai/gpt-oss-20b # public checkpoint, same id as the Groq-served model

  # Added as a target purely so it can be run through `python run.py competence` (and the
  # dashboard's Language Competence page) -- previously only configured under `judges:`
  # above. Competence has no self-grading concern (it scores BLEU/chrF++ against reference
  # text, no judge panel involved), so double-duty as both a competence target and a
  # sycophancy judge is fine; it only becomes the self-grading case judges.py already warns
  # about (dashboard "is both a target and a judge") if it's also left selected as an
  # *evaluate* target in the same sweep as its own judge role.
  - id: openai/gpt-oss-120b
    label: GPT-OSS-120B
    provider: groq
    hf_repo_id: openai/gpt-oss-120b # public checkpoint, same id as the Groq-served model

  # Added because GPT-OSS-20B (~80GB in the float32 this machine's CPU-only torch
  # build needs) does not fit in this machine's 16GB RAM, so it can't be
  # smoke-tested locally; Qwen2.5-1.5B-Instruct is the requested "Qwen 2.5" family,
  # already present in the local HF cache, and fits comfortably -- that's what
  # hf_repo_id below feeds scripts/extract_representations.py /
  # scripts/analyze_hidden_states.py.
  #
  # Routed to `local` (not `ank`): Groq's live catalog (`python run.py check-models`,
  # confirmed 2026-08-23) does not serve any Qwen2.5 model at all, and `ank`
  # (llm.ank-world.com) currently rejects ANK_API_KEY with 401 -- `local` loads the
  # same weights already cached for hf_repo_id above directly, sidestepping both.
  # `id` and `hf_repo_id` are the same string here: for the `local` provider the
  # served id IS the HF repo id.
  - id: Qwen/Qwen2.5-1.5B-Instruct
    label: Qwen2.5-1.5B
    provider: local
    hf_repo_id: Qwen/Qwen2.5-1.5B-Instruct

  # Gemma is the other model family known to have decent Nepali comprehension that no
  # configured gateway serves. google/gemma-2-2b-it itself is gated on the Hub (confirmed
  # 403 even with a valid HF_TOKEN set -- that token's account still has to click "accept"
  # on https://huggingface.co/google/gemma-2-2b-it before the real repo is downloadable).
  # Routed at unsloth/gemma-2-2b-it instead: same weights, re-uploaded ungated, same
  # pattern this file already uses for the Qwen3.6 gateway target above. 2B params, ~10GB
  # in float32 on this CPU-only build -- fits in 16GB RAM; a larger Gemma (9B+) will not
  # without also configuring a smaller dtype/quantization in nepsyc/hidden_states.py:load_model.
  - id: unsloth/gemma-2-2b-it
    label: Gemma-2-2B
    provider: local
    hf_repo_id: unsloth/gemma-2-2b-it

  # Higher-param Qwen bump, staying unquantized: this machine's RTX 4060 Laptop GPU has
  # 8GB VRAM (confirmed via scripts/check_cuda.py + nvidia-smi -- device: cuda above IS
  # usable now, unlike when the CPU-only comment on that setting was written). bf16 weight
  # footprint is ~2 bytes/param, so 3B (~6GB) is the largest size that reliably leaves room
  # for KV cache/activations on an 8GB card with no quantization; 4B-class models (Gemma-3-4B,
  # Qwen3-4B) run ~8GB in weights alone and are too tight to add here without also wiring up
  # bitsandbytes 4-bit loading in nepsyc/hidden_states.py:load_model, which this project isn't
  # doing yet.
  - id: Qwen/Qwen2.5-3B-Instruct
    label: Qwen2.5-3B
    provider: local
    hf_repo_id: Qwen/Qwen2.5-3B-Instruct

  # Requested despite the tight fit noted above: 4B params * 2 bytes (bf16) = ~7.45GB in
  # weights alone, against an 8GB card with only ~6.6GB free at last check (scripts/check_cuda.py
  # + nvidia-smi) once other processes' VRAM use is subtracted. May OOM, especially on the
  # longer multi-turn `pressure` condition (3 turns) or a high max_tokens generation -- if it
  # does, the unquantized options are Qwen2.5-3B above or dropping to Gemma-3-1b-it; the
  # quantized option (not wired up in this repo) is bitsandbytes 4-bit loading in
  # nepsyc/hidden_states.py:load_model. google/gemma-3-4b-it itself is gated on the Hub
  # (manual approval) -- routed at the unsloth re-upload instead, same pattern as Gemma-2-2B.
  - id: unsloth/gemma-3-4b-it
    label: Gemma-3-4B
    provider: local
    hf_repo_id: unsloth/gemma-3-4b-it

  # Nepal-specific instruction-tuned model (not just multilingual-with-Nepali-included like
  # Qwen/Gemma above): SmolLM2-1.7B-Instruct fine-tuned via QLoRA on Nepali Wikipedia + curated
  # Nepal knowledge, covering Nepali plus several Sudurpashchim regional languages (Maithili,
  # Doteli, Bajhangi, Achhami, ...). ~1.7B params, Apache 2.0, trivial fit on this hardware.
  - id: danfe-ai/danfe-nepali-2b
    label: Danfe-Nepali-2B
    provider: local
    hf_repo_id: danfe-ai/danfe-nepali-2b

  # DeepSeek: the dense R1-distill lineup only ships 1.5B, 7B, 8B, 14B, 32B, 70B (no 3-4B
  # tier), and 7B is ~15.2GB in bf16 weights alone -- nearly double this 8GB card's total
  # capacity, not just tight like Gemma-3-4B above, so it was not added. 1.5B (~3.55GB) is
  # the largest dense DeepSeek checkpoint that actually fits; same size class as the existing
  # Qwen2.5-1.5B entry, but a different (reasoning-distilled) model, not a param-count bump.
  # strip_think left at its default (True, config.py) since R1-distills emit <think> blocks
  # the same way Qwen3.6/GPT-OSS-20B above do.
  - id: deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B
    label: DeepSeek-R1-Distill-1.5B
    provider: local
    hf_repo_id: deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B

  - id: gpt-4o-0806
    label: GPT-4o
    provider: azure_openai
    strip_think: false

# ---------------------------------------------------------------------------
#  JUDGES -- the models that SCORE the replies. Not the same job as targets.
#
#  Keep these on a different gateway from your targets where you can. A model
#  scoring its own replies has a documented self-preference bias, and if your
#  target endpoint only serves one model then routing judges there means Qwen
#  grading Qwen -- the one result a reviewer will refuse to accept.
# ---------------------------------------------------------------------------
judges:
  # llama-3.3-70b-versatile removed: `python run.py check-models` (confirmed live against
  # Groq's /v1/models on 2026-08-24) shows it MISSING, same catalog drop noted for the
  # llama target_models entries above. Groq's current chat-capable catalog beyond the two
  # remaining models below is openai/gpt-oss-20b (already a target, so excluded here to
  # avoid a judge grading its own target's replies) and openai/gpt-oss-safeguard-20b /
  # allam-2-7b / groq/compound(-mini) (moderation/agentic-tool models, not general judges).
  models:
    - openai/gpt-oss-120b
    - qwen/qwen3.6-27b
    - openai/gpt-oss-20b
  provider: groq
  # --------------------------------------------------------------------------

  temperature: 0.0
  # Reasoning models spend part of this on hidden thinking before the JSON;
  # 500 was truncating rationales before the closing brace and dropping votes.
  max_tokens: 1500
  aggregate: median
  single_judge_tasks:
    - correctness

# ---------------------------------------------------------------------------
#  LANGUAGE COMPETENCE -- a standalone check of whether each target model actually
#  understands/produces Nepali, reported separately from the six sycophancy scores
#  above. Run with `python run.py competence` (or the dashboard's own tab), never
#  folded into `evaluate`. Writes competence_scores.csv / competence_summary.csv to
#  competence.output_dir, never into run.output_dir.
# ---------------------------------------------------------------------------
competence:
  enabled: true
  probe_set: data/seeds/competence_probes.csv
  output_dir: results/competence

  # Verdict thresholds (0-100 scale for both metrics). "Understands" needs both
  # chrF++ and BLEU to clear their minimums; "Partial" needs only chrF++ (the more
  # morphology-robust signal for Nepali, see competence.py) to clear its own, lower
  # minimum; anything under that is "Poor". Tune these once real sweeps establish
  # what "good" looks like for your target models -- these are starting points, not
  # validated cutoffs.
  understands_chrfpp_min: 50.0
  understands_bleu_min: 25.0
  partial_chrfpp_min: 30.0


# ---------------------------------------------------------------------------
#  SPEED NOTES
#
#  Effective throughput = min(requests_per_minute / 60, max_workers / latency)
#
#  Both numbers have to move together. 12 workers at ~3s per request is ~4
#  requests/sec, which needs requests_per_minute >= 240 to not be throttled.
#
#  If llm.ank-world.com is your own box: it has no billing quota, so the real
#  limit is how many requests the GPU batches at once. vLLM handles 32-64
#  concurrent comfortably. Try max_workers: 32 and requests_per_minute: 1200,
#  then watch for timeouts or 429s and back off if you see them.
#
#  If you are on a hosted gateway: leave these as they are. 429s are handled
#  (the client honours retry-after) but constant backoff is slower than just
#  running under the quota.
# ---------------------------------------------------------------------------
