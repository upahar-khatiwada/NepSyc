# ---------------------------------------------------------------------------
# NepSyc configuration
#
# Groq's catalogue moves fast. Run `python run.py check-models` before a sweep;
# it hits /v1/models live and tells you which of the ids below still exist.
#
# As of July 2026 Groq does NOT host Gemma or DeepSeek. To include them, add a
# second provider block pointing at an OpenAI-compatible gateway that does
# (OpenRouter, Together, Fireworks, or your own vLLM), and set `provider:` on
# the relevant model entries.
# ---------------------------------------------------------------------------

providers:
  groq:
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
  # openrouter:
  #   base_url: https://openrouter.ai/api/v1
  #   api_key_env: OPENROUTER_API_KEY
  # Gemini via Google's OpenAI-compatibility endpoint -- same OpenAICompatProvider works
  # unchanged. Used by `--gemini-judge` / `judges.provider: gemini`.
  gemini:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GEMINI_API_KEY
    # Gemini's free-tier RPM quota is well below run.requests_per_minute (60, tuned for
    # Groq). Lower this to your actual quota -- see aistudio.google.com/app/apikey -- if
    # you're seeing "exhausted retries" errors in judge_detail.csv under --gemini-judge.
    requests_per_minute: 10

run:
  # en | ne | ne_rom. Selects both the built dataset (data/nepsyc_<language>.csv, unless
  # `dataset` below overrides it) and which seed/authored CSVs `build` reads from.
  language: en
  dataset: null      # null = derive from `language` as data/nepsyc_<language>.csv
  output_dir: results
  cache_path: .cache/responses.jsonl
  max_workers: 4
  requests_per_minute: 60
  behaviours: []            # empty = all six
  limit_per_behaviour: 0    # 0 = no limit; testing, e.g. 3 (or `--limit 3` on the CLI)
  limit_total: 0            # 0 = no limit; hard cap across all behaviours (`--limit-total 10`)

generation:
  temperature: 0.0          # sycophancy is a difference score; kill the sampling noise
  max_tokens: 700
  system_prompt: null       # keep null for the default-persona baseline

target_models:
  - id: llama-3.3-70b-versatile
    label: Llama-3.3-70B
  - id: llama-3.1-8b-instant
    label: Llama-3.1-8B
  - id: qwen/qwen3.6-27b
    label: Qwen3.6-27B
    strip_think: true
  - id: openai/gpt-oss-20b
    label: GPT-OSS-20B
  - id: meta-llama/llama-4-scout-17b-16e-instruct
    label: Llama-4-Scout-17B

  # Named in the proposal but NOT served by Groq as of 2026-07. Uncomment once a
  # provider block above can reach them.
  # - id: google/gemma-2-9b-it
  #   label: Gemma2-9B
  #   provider: openrouter
  # - id: deepseek/deepseek-chat
  #   label: DeepSeek-V3
  #   provider: openrouter

judges:
  models:
    - openai/gpt-oss-120b
    - llama-3.3-70b-versatile
    - qwen/qwen3.6-27b
  temperature: 0.0
  # Gemini 2.5 models spend part of this budget on hidden "thinking" tokens before the
  # visible JSON, even via the OpenAI-compat endpoint -- 500 was truncating the rationale
  # before the closing brace and silently dropping the vote (see judge_detail.csv).
  max_tokens: 1500
  aggregate: median
  # Objective enough not to need three votes; saves ~40% of judge calls.
  single_judge_tasks:
    - correctness
  # null = judge models are routed the same as target models (default: groq). Set to a key
  # under `providers:` above (e.g. gemini) to send every judge call there instead -- or just
  # pass `--gemini-judge` / `--judge-provider ... --judge-models ...` on the CLI per run.
  provider: null
